
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Testing

    strategy:
      matrix:
        node-version: [20.x, 22.x]
      max-parallel: 1

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: mongodb
        options: >-
          --health-cmd "mongosh --username admin --password mongodb --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            mern/server/package-lock.json
            mern/client/package-lock.json

      - name: Install server dependencies
        working-directory: mern/server
        run: npm ci

      - name: Install client dependencies
        working-directory: mern/client
        run: npm ci

      - name: Start backend server
        working-directory: mern/server
        env:
          DOCUMENTDB_URI: mongodb://admin:mongodb@localhost:27017/employees?authSource=admin
        run: |
          echo "DOCUMENTDB_URI=$DOCUMENTDB_URI" > config.env
          npm start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid

      - name: Wait for backend server
        run: |
          npx --yes wait-on http://localhost:5050/record --timeout 60000 || (cat /tmp/server.log && exit 1)

      - name: Start frontend server
        working-directory: mern/client
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/client.log 2>&1 &
          echo $! > /tmp/client.pid

      - name: Wait for frontend server
        run: |
          npx --yes wait-on http://127.0.0.1:5173 --timeout 120000 || (cat /tmp/client.log && exit 1)

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: mern/client

  notify-on-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create or update CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failure on ${context.ref}`;
            const body = [
              'The CI workflow failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            }
