
name: Build and deploy MERN frontend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: mern/client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: mern/client/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
         client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3C2A5B5F62A148579D755C0BE6D254AE }}
         tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BEF2F54CCFCF4A7E96A2233351F8D96B }}
         subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7D49CBF418A46D98D59A64FA3E27F76 }}

      - name: Deploy frontend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: mern-employee-frontend-arfat-2026
          slot-name: Production
          package: ./dist
