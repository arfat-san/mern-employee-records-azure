
name: Build and deploy MERN frontend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: mern/client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: mern/client/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9FC2749E00004BBA4B8104810F11BD44 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A58085F75BC94899B9640CFBC6E102AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6FB6CDA736BA4C1F8333E5E1B6AD958B }}

      - name: Deploy frontend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: mern-employee-frontend-arfat-2026
          slot-name: Production
          package: ./dist
