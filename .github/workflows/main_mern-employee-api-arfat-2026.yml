
name: Deploy MERN Backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        run: npm ci
        working-directory: mern/server

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3C2A5B5F62A148579D755C0BE6D254AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BEF2F54CCFCF4A7E96A2233351F8D96B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7D49CBF418A46D98D59A64FA3E27F76 }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mern-employee-api-arfat-2026
          slot-name: Production
          package: mern/server
